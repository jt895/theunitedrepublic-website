<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Fonts come from Google via the CSS @import; warming both hosts early
         shaves the round trips off the first paint of Instrument Serif. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="theme-color" content="#231F20" />
    <meta name="description" content="Independent strategic advisory and practical growth support for established Australian businesses and complex organisations." />
    <meta property="og:title" content="The United Republic | Strategy and Business Growth" />
    <meta property="og:description" content="Independent strategic advisory and practical growth support for established Australian businesses and complex organisations." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://theunitedrepublic.com.au/" />
    <meta property="og:site_name" content="The United Republic" />
    <!--
      Default share image. prerender.mjs and routes.ts (updateDocumentMetadata)
      both overwrite this per route with route.image when set, falling back to
      this same default otherwise - see src/routes.ts's defaultOgImage.
      Drop the 1200x630 default file at public/og/default.png (per-page
      overrides go in the same public/og/ folder, referenced via each route's
      `image` field in src/routes.ts).
    -->
    <meta property="og:image" content="https://theunitedrepublic.com.au/og/default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The United Republic" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://theunitedrepublic.com.au/og/default.png" />
    <link rel="canonical" href="https://theunitedrepublic.com.au/" />
    <title><!-- figma:title --></title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "The United Republic",
        "url": "https://theunitedrepublic.com.au/",
        "email": "jt@theunitedrepublic.com.au",
        "telephone": "+61407744388",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Adelaide",
          "addressRegion": "South Australia",
          "addressCountry": "AU"
        },
        "areaServed": "AU",
        "description": "Independent Australian strategy and business growth advisory, based in Adelaide, South Australia."
      }
    </script>
    <!-- figma:head-end -->
    <noscript>
      <style>
        /* Scroll reveals are JS-driven; without it the prerendered copy would
           stay at opacity 0. Show everything instead. */
        .reveal { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>

    <!--
      Static Netlify Forms declarations.
      This is a client-rendered React app, so Netlify's build-time HTML scan
      never sees the real forms rendered from src/components/EnquiryForm.tsx
      unless it's looking at prerendered output. These hidden duplicates give
      Netlify's form parser a plain-HTML copy of every field name so each form
      is registered and ready to receive submissions regardless. They are never
      shown to visitors and never submitted directly.
    -->
    <div hidden>
      <form name="growth-charter-enquiry" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="growth-charter-enquiry" />
        <input type="hidden" name="source-page" value="" />
        <input type="text" name="bot-field" />
        <input type="text" name="name" />
        <input type="text" name="business" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <textarea name="message"></textarea>
      </form>
      <form name="viability-session-enquiry" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="viability-session-enquiry" />
        <input type="hidden" name="source-page" value="" />
        <input type="text" name="bot-field" />
        <input type="text" name="name" />
        <input type="text" name="business" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <textarea name="message"></textarea>
      </form>
      <form name="strategic-advisory-enquiry" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="strategic-advisory-enquiry" />
        <input type="hidden" name="source-page" value="" />
        <input type="text" name="bot-field" />
        <input type="text" name="name" />
        <input type="text" name="organisation" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <textarea name="message"></textarea>
      </form>
      <form name="charter-course-waitlist" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="charter-course-waitlist" />
        <input type="hidden" name="source-page" value="" />
        <input type="text" name="bot-field" />
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="business" />
        <textarea name="message"></textarea>
      </form>
    </div>

    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
